name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the check and the builds; publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Gates the run: the tag names the workspace version at its commit, the commit is on main, and
  # main's CI passed for it. A dispatch runs the same gates without the tag.
  check:
    name: tag, main and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ironwork") | .version')
          if [ "$EVENT" = push ] && [ "v$version" != "$TAG" ]; then echo "tag $TAG does not match ironwork $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main"; exit 1
          fi
      - name: CI passed for this commit
        run: |
          runs=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$runs" -lt 1 ]; then echo "ci.yml has no successful run for $GITHUB_SHA"; exit 1; fi

  binaries:
    name: binary (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Build
        shell: bash
        run: cargo build --release --locked -p ironwork --target "$TARGET"
      - name: Stage
        shell: bash
        run: |
          exe=ironwork
          if [ "$RUNNER_OS" = Windows ]; then exe=ironwork.exe; fi
          mkdir -p "dist/$TARGET"
          cp "target/$TARGET/release/$exe" "dist/$TARGET/$exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  tls-binaries:
    name: TLS binary (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      # ring compiles C and assembly, so a musl target needs musl's C compiler.
      - name: C compiler for musl
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked --manifest-path tls/Cargo.toml --target "$TARGET"
      - name: Stage
        shell: bash
        run: |
          exe=ironwork
          if [ "$RUNNER_OS" = Windows ]; then exe=ironwork.exe; fi
          mkdir -p "dist/$TARGET"
          cp "tls/target/$TARGET/release/$exe" LICENSE tls/THIRD-PARTY-NOTICES.md "dist/$TARGET/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-${{ matrix.target }}
          path: dist/

  wheels:
    name: wheel (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/

  sdist:
    name: source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: wheels/

  npm:
    name: npm package
    needs: [check, binaries]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: packaging/npm/dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Assemble
        working-directory: packaging/npm
        run: |
          cp ../../README.md ../../LICENSE ../../NOTICE ../../RUNTIME-EXCEPTION.md ../../THIRD-PARTY-NOTICES.md .
          chmod +x bin/ironwork.js dist/*/ironwork
          npm pkg set version="$VERSION"
          npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: packaging/npm/portll-ironwork-*.tgz

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [check, binaries, tls-binaries, wheels, sdist, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tls-*
          merge-multiple: true
          path: tls/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: npm/
      - name: Archive
        run: |
          mkdir out
          for dir in bin/*/; do
            target=$(basename "$dir")
            if [ -f "$dir/ironwork.exe" ]; then
              (cd "$dir" && zip -q "../../out/ironwork-$VERSION-$target.zip" ironwork.exe)
            else
              chmod +x "$dir/ironwork"
              tar -czf "out/ironwork-$VERSION-$target.tar.gz" -C "$dir" ironwork
            fi
          done
          for dir in tls/*/; do
            target=$(basename "$dir")
            if [ -f "$dir/ironwork.exe" ]; then
              (cd "$dir" && zip -q "../../out/ironwork-tls-$VERSION-$target.zip" ironwork.exe LICENSE THIRD-PARTY-NOTICES.md)
            else
              chmod +x "$dir/ironwork"
              tar -czf "out/ironwork-tls-$VERSION-$target.tar.gz" -C "$dir" ironwork LICENSE THIRD-PARTY-NOTICES.md
            fi
          done
          cp npm/portll-ironwork-*.tgz out/
          (cd out && sha256sum -- * > SHA256SUMS)
      # SLSA build provenance for each archive, signed through GitHub's OIDC identity:
      # gh attestation verify <file> -R Portll/ironwork
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      - name: Publish
        run: |
          gh release create "$TAG" out/* --verify-tag --title "ironwork $VERSION" \
            --notes "ironwork for COBOL $VERSION. Builds for Linux (static), macOS and Windows, and the npm package @portll/ironwork. The ironwork-tls archives are the same builds with TLS for --sql-db (rustls, sslmode=verify-full). The Python package is on PyPI as ironwork, and the crates are on crates.io. Each file carries SLSA build provenance: gh attestation verify <file> -R Portll/ironwork."

  npm-publish:
    name: publish to npm
    if: github.event_name == 'push'
    needs: [check, binaries, tls-binaries, wheels, sdist, npm, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: npm/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.5.1 or later
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Publish
        run: npm publish "./npm/portll-ironwork-$VERSION.tgz" --access public

  crates-io:
    name: publish to crates.io
    if: github.event_name == 'push'
    needs: [check, binaries, tls-binaries, wheels, sdist, npm, release, npm-publish]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: [check, binaries, tls-binaries, wheels, sdist, npm, release, npm-publish, crates-io]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
