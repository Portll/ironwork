name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cobolwork's option and CICS tables and fixtures/cobolwork are vendored; drift tests compare them,
      # and `cobolwork evidence verify` reads the evidence of ironwork runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Portll/cobolwork
          # Pinned to cobolwork commits whose shared tables drift tests pass against.
          ref: bbbb80a133ebf0feb867652588c7470abf0d20df
          path: cobolwork
          persist-credentials: false
          sparse-checkout: |
            provenance/*.tsv
            test/fixtures/bms/
            test/fixtures/sql/
            test/fixtures/entry/REGION.csd
            test/fixtures/intrdr/declared/REGION.CSD
            test/fixtures/outbound/REGION.csd
            test/fixtures/priv/REGION.csd
            test/fixtures/web-csd/REGION.csd
            test/fixtures/evidence/
            bin/
            lib/
            rules/
            package.json
          sparse-checkout-cone-mode: false
      # NIST's CCVS85 audit routines, one program to a file, which tools/nist.py runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z390development/nistcobol85
          ref: 272a401985c66dfca4302ff9bb037def167bc5f3
          path: nistcobol85
          persist-credentials: false
          sparse-checkout: src/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        env:
          IRONWORK_COBOLWORK_DIR: ${{ github.workspace }}/cobolwork
        run: cargo test --workspace --locked
      - name: NIST CCVS85 on the interpreter and the VM
        run: |
          cargo build --locked -p ironwork
          python3 tools/nist.py target/debug/ironwork nistcobol85/src --vm
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # tls/ is a workspace of its own with rustls, so the one above stays free of dependencies.
      - name: Test the TLS build
        run: cargo test --locked --manifest-path tls/Cargo.toml
      - name: Clippy the TLS build
        run: cargo clippy --locked --all-targets --manifest-path tls/Cargo.toml -- -D warnings

  # The release builds for these too; the job above covers Linux x86-64.
  platforms:
    name: test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86-64, os: macos-15-intel }
          - { name: Windows x86-64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test the TLS build
        run: cargo test --locked --no-fail-fast --manifest-path tls/Cargo.toml

  msrv:
    name: build on the minimum Rust, 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check
        run: cargo +1.95.0 check --workspace --all-targets --locked
      - name: Check the TLS build
        run: cargo +1.95.0 check --all-targets --locked --manifest-path tls/Cargo.toml
