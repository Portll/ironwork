name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cobolwork's option and CICS tables and fixtures/cobolwork are vendored; drift tests compare them,
      # and cobolwork's evidence verifier reads the evidence of ironwork runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Portll/cobolwork
          # Pinned to cobolwork commits whose shared tables drift tests pass against.
          ref: 8b5bbbb70a96063d8ea48731e2a42ec6a7c0fdd0
          path: cobolwork
          persist-credentials: false
          sparse-checkout: |
            provenance/*.tsv
            test/fixtures/bms/
            test/fixtures/sql/
            test/fixtures/entry/REGION.csd
            test/fixtures/intrdr/declared/REGION.CSD
            test/fixtures/outbound/REGION.csd
            test/fixtures/priv/REGION.csd
            test/fixtures/web-csd/REGION.csd
            test/fixtures/evidence/
            lib/evidence/
          sparse-checkout-cone-mode: false
      # NIST's CCVS85 audit routines, one program to a file, which tools/nist.py runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z390development/nistcobol85
          ref: 272a401985c66dfca4302ff9bb037def167bc5f3
          path: nistcobol85
          persist-credentials: false
          sparse-checkout: src/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        env:
          IRONWORK_COBOLWORK_DIR: ${{ github.workspace }}/cobolwork
        run: cargo test --workspace --locked
      - name: NIST CCVS85 on the interpreter and the VM
        run: |
          cargo build --locked -p ironwork
          python3 tools/nist.py target/debug/ironwork nistcobol85/src --vm
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # tls/ is a workspace of its own with rustls, so the one above stays free of dependencies.
      - name: Test the TLS build
        run: cargo test --locked --manifest-path tls/Cargo.toml
      - name: Clippy the TLS build
        run: cargo clippy --locked --all-targets --manifest-path tls/Cargo.toml -- -D warnings
