name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cobolwork's option and CICS tables and fixtures/cobolwork are vendored; drift tests compare them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Portll/cobolwork
          path: cobolwork
          persist-credentials: false
          sparse-checkout: |
            provenance/*.tsv
            test/fixtures/bms/
            test/fixtures/sql/
          sparse-checkout-cone-mode: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        env:
          IRONWORK_COBOLWORK_DIR: ${{ github.workspace }}/cobolwork
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # tls/ is a workspace of its own with rustls, so the one above stays free of dependencies.
      - name: Test the TLS build
        run: cargo test --locked --manifest-path tls/Cargo.toml
      - name: Clippy the TLS build
        run: cargo clippy --locked --all-targets --manifest-path tls/Cargo.toml -- -D warnings
