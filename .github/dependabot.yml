# The workspace has no dependencies outside its own crates. The TLS build in tls/ takes rustls and
# webpki-roots from crates.io, and its lock file is watched with the actions the workflow pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: cargo
    directory: /tls
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      tls:
        patterns: ["*"]
    commit-message:
      prefix: "chore(tls)"
