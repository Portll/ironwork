[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.7.0"
license = "AGPL-3.0-or-later"
publish = true
repository = "https://github.com/Portll/ironwork"
homepage = "https://github.com/Portll/ironwork"
readme = "README.md"
keywords = ["cobol", "compiler", "mainframe", "ebcdic", "zos"]
categories = ["compilers", "emulators"]

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ironwork_tls)"] }
