[workspace]
resolver = "3"
members = ["crates/*", "tools/ddl"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.9.0"
license = "AGPL-3.0-or-later"
publish = true
repository = "https://github.com/Portll/ironwork"
homepage = "https://github.com/Portll/ironwork"
readme = "README.md"
keywords = ["cobol", "compiler", "mainframe", "ebcdic", "zos"]
categories = ["compilers", "emulators"]

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ironwork_tls)"] }
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"

# Kept at zero across every target (docs/hardened.md).
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
mem_forget = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
fn_to_numeric_cast_any = "deny"
host_endian_bytes = "deny"
infinite_loop = "deny"
large_include_file = "deny"
large_stack_arrays = "deny"
suspicious_xor_used_as_pow = "deny"
cfg_not_test = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
rc_mutex = "deny"
rc_buffer = "deny"
mutex_atomic = "deny"
empty_drop = "deny"
try_err = "deny"
pathbuf_init_then_push = "deny"

# The hardened build: release with overflow checks, no unwinding and one optimised unit
# (docs/hardened.md). `cargo build --profile hardened --features hardened -p ironwork`.
[profile.hardened]
inherits = "release"
overflow-checks = true
debug-assertions = false
panic = "abort"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
